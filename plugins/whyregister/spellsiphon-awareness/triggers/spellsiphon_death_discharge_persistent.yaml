name: spellsiphon_death_discharge_persistent
description: >-
  Logs player Death Discharge (Freeze / KSSC_DeathDischarge).

eventCriteria:
  eventType: spell_cast
  schemaConditions:
    - fieldPath: spell_editor_id
      operator: equals
      value: KSSC_DeathDischarge
    - fieldPath: actor
      operator: equals
      value: "{{ player.name }}"
      caseSensitive: false

response:
  type: persistent_generic
  content: >-
    {{ player.name }} discharged a siphoned Death charge — cold biting
    through the release. Record the Discharge act only. Do not lecture on
    drawing or combos.

audience: nearby_npcs

enabled: true
interrupt: false
probability: 0.8
cooldownSeconds: 8
priority: 9
