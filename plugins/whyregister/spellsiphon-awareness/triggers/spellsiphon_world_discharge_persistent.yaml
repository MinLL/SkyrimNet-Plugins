name: spellsiphon_world_discharge_persistent
description: >-
  Logs player World Discharge (Suspended World). Not the on-hit KSSC_Discharge spam.

eventCriteria:
  eventType: spell_cast
  schemaConditions:
    - fieldPath: spell_editor_id
      operator: equals
      value: KSSC_WorldDischargeTimeSlow
    - fieldPath: actor
      operator: equals
      value: "{{ player.name }}"
      caseSensitive: false

response:
  type: persistent_generic
  content: >-
    {{ player.name }} discharged a siphoned World charge — time and heat
    buckling around the release. Record the Discharge act only. Do not
    lecture on drawing or combos.

audience: nearby_npcs

enabled: true
interrupt: false
probability: 0.8
cooldownSeconds: 8
priority: 9
