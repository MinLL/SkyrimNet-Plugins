name: IddleWheelAnimation_WriteDownNoteBook
description: Write something down
eventCriteria:
  eventType: active_effect
  schemaConditions:
    - fieldPath: effect
      operator: equals
      value: IdlePlayWriteME
      caseSensitive: false
    - fieldPath: action
      operator: equals
      value: applied
audience: nearby_npcs
response:
  type: direct_narration
  content: "{{ originator }} takes out a notepad and a pen and starts writing something down."
enabled: true
cooldownSeconds: 5
priority: 5