name: IddleWheelAnimation_Discuss
description: "Idle Animations WheelMenu SE TRIGGER:\nYou are discussing something."
eventCriteria:
  eventType: active_effect
  schemaConditions:
    - fieldPath: effect
      operator: equals
      value: IdlePlayDiscussME
      caseSensitive: false
    - fieldPath: action
      operator: equals
      value: applied
audience: nearby_npcs
response:
