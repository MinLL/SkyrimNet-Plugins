name: IddleWheelAnimation_Respect
description: "Idle Animations WheelMenu SE TRIGGER:\nShow some respect."
eventCriteria:
  eventType: active_effect
  schemaConditions:
    - fieldPath: effect
      operator: equals
      value: IdlePlayBracedPainME
      caseSensitive: false
    - fieldPath: action
      operator: equals
      value: applied
audience: nearby_npcs
response:
