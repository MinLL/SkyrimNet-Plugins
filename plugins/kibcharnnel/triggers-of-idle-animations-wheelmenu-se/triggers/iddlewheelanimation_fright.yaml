name: IddleWheelAnimation_Fright
description: "Idle Animations WheelMenu SE TRIGGER:\nBoo!Are you afraid?"
eventCriteria:
  eventType: active_effect
  schemaConditions:
    - fieldPath: effect
      operator: equals
      value: IdlePlayFrightenedGestureME
      caseSensitive: false
    - fieldPath: action
      operator: equals
      value: applied
audience: nearby_npcs
response:
