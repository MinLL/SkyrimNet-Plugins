name: IddleWheelAnimation_Think
description: "Idle Animations WheelMenu SE TRIGGER:\nShow that you are a thinker. Rub your chin with a smart face."
eventCriteria:
  eventType: active_effect
  schemaConditions:
    - fieldPath: effect
      operator: equals
      value: IdlePlayStudyME
      caseSensitive: false
    - fieldPath: action
      operator: equals
      value: applied
audience: nearby_npcs
response:
  type: direct_narration
  content: "{{ originator }} rubs his/her chin with the fingers of his/her left hand, showing that {{ originator }} is in deep thoughts. {{ originator }} is thinking."
enabled: true
cooldownSeconds: 5
priority: 3