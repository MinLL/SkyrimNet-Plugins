name: SDIO_IdleComments_Misogynists_Player
description: Trigger prompting male NPC to say sexist comments to female players
eventCriteria:
  eventType: dialogue_background
  schemaConditions:
    - fieldPath: speaker
      operator: regex
      value: .*
audience: player
response:
  type: direct_narration
  content: "{% set comments = [\"sexually degrade\", \"make a sexually charged comment to\", \"catcall\", \"objectify\", \"demand sexual gratification from\"] %}\n{% set s = decnpc(originator_uuid) %}\n{% if not s.isFemale %}\n  {% set idx = random % length(comments) %}\n  {{ s.name }} has an irresistible urge to {{ at(comments, idx) }} {{ player.name }}.\n{% endif %}"
enabled: true
probability: 0.5
cooldownSeconds: 120
interrupt: true