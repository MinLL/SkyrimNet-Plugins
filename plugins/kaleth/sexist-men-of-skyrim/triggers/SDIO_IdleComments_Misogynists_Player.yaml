name: SDIO_IdleComments_Misogynists_Player
description: Trigger prompting male NPC to say sexist comments to female players
eventCriteria:
  eventType: dialogue_background
  schemaConditions:
    - fieldPath: speaker
      operator: regex
      value: .*
audience: player
response:
  type: direct_narration
  content: "{% set comments = [\"degrade\", \"make a sexually charged comment to\", \"catcall\", \"objectify\", \"demand sexual gratification from\"] %}\n{% set candidates = get_nearby_npc_list(player.UUID) %}\n{% set distance = 9999999 %}\n{% set pick = \"\" %}\n{% for candidate in candidates %}\n  {% set  d = distance_between(player.UUID, candidate.UUID) %}\n  {% if not candidate.isFemale %}\n    {% if d < distance and d > 0 %}\n      {% set distance = d %}\n      {% set pick = candidate %}\n    {% endif %}\n  {% endif %}\n{% endfor %}\n{% if pick and pick != \"\" %}\n  {% set idx = random % length(comments) %}\n  {{ pick.name }} has a strong urge to {{ at(comments, idx) }} {{ player.name }}.\n{% endif %}"
enabled: true
cooldownSeconds: 15
interrupt: true